# Firebase App Hosting: roda o Next.js (páginas + rotas /api em Node) no Cloud Run.
# Segredos ficam no Cloud Secret Manager. Crie com:
#   firebase apphosting:secrets:set anthropic-api-key
#   firebase apphosting:secrets:set maintenance-secret
# Ver docs/adr/0016-correcoes-da-auditoria.md.

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # Configuração pública do app da Web (Console → Configurações do projeto → Seus apps).
  # Precisa existir no build (o Next embute NEXT_PUBLIC_* no código do navegador).
  - variable: NEXT_PUBLIC_APP_URL
    value: https://SEU-DOMINIO
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: PREENCHER
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: PREENCHER
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: PREENCHER
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: PREENCHER
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: PREENCHER
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: PREENCHER
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
    value: PREENCHER
    availability: [BUILD, RUNTIME]

  # Somente servidor (nunca NEXT_PUBLIC_).
  - variable: ANTHROPIC_API_KEY
    secret: anthropic-api-key
    availability: [RUNTIME]
  - variable: MAINTENANCE_SECRET
    secret: maintenance-secret
    availability: [RUNTIME]
